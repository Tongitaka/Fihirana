name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Icons + splash
        run: npx capacitor-assets generate --android

      - name: Custom MainActivity (loko status bar / nav bar)
        run: |
          D=android/app/src/main/java/com/jesosymamonjy/app
          mkdir -p "$D"
          cp android-overrides/MainActivity.java "$D/MainActivity.java"

      - name: Version
        run: |
          VN=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Baiboly-Fihirana-JM-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ----- APK sonia (release) : mandeha raha misy ny secrets -----
      - name: Build signed release APK
        if: ${{ env.KS_B64 != '' }}
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          cd android && ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UN=app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $UN aligned.apk
          $BT/apksigner sign --ks ../release.keystore --ks-pass pass:"$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASS" --out ../Baiboly-Fihirana-JM-release.apk aligned.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('Baiboly-Fihirana-JM-release.apk') != '' }}
        with:
          name: Baiboly-Fihirana-JM-release
          path: Baiboly-Fihirana-JM-release.apk

# Manamboatra APK Android (debug) — Capacitor
# Actions → Build Android APK → Run workflow → Artifacts → HIRA-plus-debug
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install npm packages
        run: |
          npm install --no-fund --no-audit
          npx cap --version
          node -v
          java -version

      - name: Build web assets (www/)
        run: node scripts/sync-www.js

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          test -d android || (echo "android/ tsy nisy taorian'ny cap add" && exit 1)

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply icons and splash
        run: node scripts/apply-android-branding.js

      - name: Patch Android SDK versions if needed
        run: |
          # Hamarino fa misy compileSdk / targetSdk
          if [ -f android/variables.gradle ]; then
            cat android/variables.gradle
          fi
          if [ -f android/app/build.gradle ]; then
            grep -E "minSdk|compileSdk|targetSdk" android/app/build.gradle || true
          fi

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK output
        if: always()
        run: |
          find android -name "*.apk" 2>/dev/null || echo "Tsy nisy APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HIRA-plus-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
